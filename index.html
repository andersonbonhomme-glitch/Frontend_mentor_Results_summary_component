<!doctype html>
<html lang="en">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Results summary component</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet"
  />
</html>
<body>
  <div class="box-container">
    <div class="results">
      <h1>Your Result</h1>
      <div class="circle">
        <span id="score-result">76</span>
        <span id="total">of 100</span>
      </div>
      <h2>Great</h2>
      <p>You score higher than 65% of the people who have taken these tests.</p>
    </div>
    <div class="summary">
      <h3>Summary</h3>
      <div class="reaction">
        <img src="/icon-reaction.svg" alt="the icon for the courses" />
        <p class="reaction-para">Reaction</p>
        <p class="reaction-score">80 / 100</p>
      </div>
      <div class="memory">
        <img src="/icon-memory.svg" alt="the icon for the memory course" />
        <p class="memory-para">Memory</p>
        <p class="memory-score">92 / 100</p>
      </div>
      <div class="verbal">
        <img src="/icon-verbal.svg" alt="the icon for the courses" />
        <p class="verbal-para">Verbal</p>
        <p class="verbal-score">61 / 100</p>
      </div>
      <div class="visual">
        <img src="/icon-visual.svg" alt="the icon for the courses" />
        <p class="visual-para">Visual</p>
        <p class="visual-score">73 / 100</p>
      </div>
      <button>Continue</button>
    </div>
  </div>
</body>
